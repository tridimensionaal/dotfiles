set-option -sa terminal-overrides ",xterm*:Tc"

# Change prefix key b to space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Keep TPM state outside the Stow-managed config tree.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'

# Open copy-mode selections in the current pane with Neovim.
set -g @open-editor-command 'nvim'

# set vi-mode
set-window-option -g mode-keys vi

# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# new things in the same directory
bind t split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind f display-popup -E -d "#{pane_current_path}" -w 80% -h 80%

# Dracula supplies the active window colours; clear tmux's default underline.
set -g window-status-current-style none

# Custom script paths are relative to ~/.tmux/plugins/tmux/scripts/.
# Retry failed weather requests promptly instead of caching errors for 20 minutes.
set -g @dracula-plugins 'battery network custom:../../../../.config/tmux/scripts/weather.sh'
set -g @dracula-custom-plugin-colors 'orange dark_gray'

run '~/.tmux/plugins/tpm/tpm'
